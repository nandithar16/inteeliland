<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>InteeliLand - Land Parcel Assessment Tool</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Store the redirect path and redirect to root
        sessionStorage.redirect = path + search + hash;
        
        // Redirect to root so index.html loads
        window.location.href = '/intelliland/';
      })();
    </script>
  </head>
  <body>
  </body>
</html>
